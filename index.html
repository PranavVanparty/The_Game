<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Manhunt Hunter Wheel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil+Display:wght@700;900&family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600&display=swap">
<style>
/* Layout: field-kit board. Wheel left, roster right; stacks on phones. Blaze orange is the one loud thing. */
:root {
  --bg: #ece8dc;
  --panel: #f7f4ec;
  --fg: #1f2a22;
  --muted: #5d6a5f;
  --line: #cfc8b4;
  --blaze: #e8541c;
  --blaze-ink: #fff7f0;
  --s1: #2f4a36; --s2: #8a7a4e; --s3: #47604c; --s4: #b3a374; --s5: #3a3f2f; --s6: #6f8a68;
  --slice-text: #f7f4ec;
  --font-display: "Big Shoulders Stencil Display", "Impact", "Arial Narrow", sans-serif;
  --font-body: "Barlow", system-ui, sans-serif;
  --font-util: "Barlow Condensed", "Arial Narrow", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141a15; --panel: #1c241e; --fg: #e8e4d6; --muted: #98a395; --line: #2e3a30;
    --blaze: #ff6a2b; --blaze-ink: #1a0d05;
    --s1: #2c4532; --s2: #6e6240; --s3: #3d5642; --s4: #8d7f55; --s5: #262b20; --s6: #557050;
    --slice-text: #f1eddf;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141a15; --panel: #1c241e; --fg: #e8e4d6; --muted: #98a395; --line: #2e3a30;
  --blaze: #ff6a2b; --blaze-ink: #1a0d05;
  --s1: #2c4532; --s2: #6e6240; --s3: #3d5642; --s4: #8d7f55; --s5: #262b20; --s6: #557050;
  --slice-text: #f1eddf;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; }
.wrap { max-width: 1060px; margin: 0 auto; padding-inline: 20px; padding-block: 28px 40px; display: grid; gap: 28px; }
header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; }
h1 { font-family: var(--font-display); font-weight: 900; font-size: clamp(2.4rem, 6vw, 3.6rem); line-height: .9; margin: 0; letter-spacing: .01em; text-transform: uppercase; text-wrap: balance; }
h1 span { color: var(--blaze); }
.kicker { font-family: var(--font-util); text-transform: uppercase; letter-spacing: .14em; font-size: .8rem; color: var(--muted); margin: 0 0 6px; }
.main { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 28px; align-items: start; }
@media (max-width: 820px) { .main { grid-template-columns: 1fr; } }

/* wheel */
.stage { display: grid; justify-items: center; gap: 18px; }
.wheel-box { position: relative; width: min(100%, 460px); aspect-ratio: 1; max-width: 100%; }
canvas { width: 100%; height: 100%; display: block; }
.pointer { position: absolute; top: -6px; left: 50%; transform: translateX(-50%); width: 34px; height: 42px; filter: drop-shadow(0 2px 2px rgba(0,0,0,.25)); }
.hub { position: absolute; inset: 50% auto auto 50%; transform: translate(-50%, -50%); width: 22%; aspect-ratio: 1; border-radius: 50%; background: var(--blaze); color: var(--blaze-ink); border: 4px solid var(--panel); font-family: var(--font-display); font-weight: 900; font-size: clamp(1rem, 3.4vw, 1.5rem); letter-spacing: .04em; cursor: pointer; text-transform: uppercase; }
.hub:disabled { cursor: default; opacity: .85; }
.hub:focus-visible, button:focus-visible, input:focus-visible { outline: 3px solid var(--blaze); outline-offset: 2px; }

.result { min-height: 92px; text-align: center; display: grid; gap: 2px; align-content: center; }
.result .label { font-family: var(--font-util); text-transform: uppercase; letter-spacing: .14em; font-size: .8rem; color: var(--muted); }
.result .name { font-family: var(--font-display); font-weight: 900; font-size: clamp(2rem, 7vw, 3rem); line-height: 1; text-transform: uppercase; overflow-wrap: anywhere; }
.result .name.hot { color: var(--blaze); }
.result .odds { font-family: var(--font-util); color: var(--muted); font-size: .95rem; font-variant-numeric: tabular-nums; }

/* roster */
.roster { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 20px; display: grid; gap: 16px; min-width: 0; }
.roster h2 { font-family: var(--font-display); font-weight: 700; text-transform: uppercase; font-size: 1.5rem; margin: 0; letter-spacing: .03em; }
.roster-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.tally { font-family: var(--font-util); color: var(--muted); font-size: .9rem; font-variant-numeric: tabular-nums; }
form { display: flex; gap: 8px; }
input[type=text] { flex: 1; min-width: 0; font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); color: var(--fg); }
.btn { font-family: var(--font-util); font-weight: 600; text-transform: uppercase; letter-spacing: .1em; font-size: .85rem; border: 1px solid var(--fg); background: var(--fg); color: var(--bg); border-radius: 4px; padding: 0 16px; cursor: pointer; }
.btn.ghost { background: transparent; color: var(--muted); border-color: var(--line); padding: 8px 12px; }
.btn.ghost:hover { color: var(--fg); border-color: var(--fg); }

ul { list-style: none; margin: 0; padding: 0; display: grid; }
li { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto auto; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
li:last-child { border-bottom: 1px solid var(--line); }
.swatch { width: 14px; height: 14px; border-radius: 2px; }
.who { min-width: 0; display: grid; gap: 4px; }
.who b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--blaze); transition: width .25s; }
.pct { font-family: var(--font-util); font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.stepper button { width: 32px; height: 32px; border: 0; background: transparent; color: var(--fg); font-size: 1.1rem; cursor: pointer; line-height: 1; }
.stepper button:hover:not(:disabled) { background: var(--line); }
.stepper button:disabled { color: var(--line); cursor: default; }
.stepper output { min-width: 28px; text-align: center; font-family: var(--font-util); font-weight: 600; font-size: 1.05rem; font-variant-numeric: tabular-nums; }
.del { border: 0; background: transparent; color: var(--muted); cursor: pointer; font-size: 1.2rem; width: 28px; height: 28px; border-radius: 4px; }
.del:hover { color: var(--blaze); }
.empty { color: var(--muted); padding: 18px 0; text-align: center; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.foot { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center; }
.check { display: inline-flex; gap: 8px; align-items: center; color: var(--muted); font-size: .9rem; cursor: pointer; }
.check input { accent-color: var(--blaze); width: 16px; height: 16px; }
.history { font-family: var(--font-util); color: var(--muted); font-size: .9rem; overflow-wrap: anywhere; }
.history b { color: var(--fg); font-weight: 600; }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div>
      <p class="kicker">Manhunt · pick the seeker</p>
      <h1>Who's the <span>Hunter</span>?</h1>
    </div>
    <p class="history" id="history"></p>
  </header>

  <div class="main">
    <section class="stage" aria-label="Wheel">
      <div class="wheel-box">
        <canvas id="wheel" aria-hidden="true"></canvas>
        <svg class="pointer" viewBox="0 0 34 42" aria-hidden="true"><path d="M17 42 L2 8 Q0 2 6 2 H28 Q34 2 32 8 Z" fill="var(--blaze)" stroke="var(--panel)" stroke-width="3"/></svg>
        <button class="hub" id="spin">Spin</button>
      </div>
      <div class="result" aria-live="polite">
        <span class="label" id="resLabel">Add players, then spin</span>
        <span class="name" id="resName">—</span>
        <span class="odds" id="resOdds"></span>
      </div>
    </section>

    <section class="roster">
      <div class="roster-head">
        <h2>Players</h2>
        <span class="tally" id="tally"></span>
      </div>
      <form id="addForm">
        <input type="text" id="nameInput" placeholder="Add a player name" maxlength="24" autocomplete="off" aria-label="Player name">
        <button class="btn" type="submit">Add</button>
      </form>
      <ul id="list"></ul>
      <div class="foot">
        <label class="check"><input type="checkbox" id="skipLast"> Last hunter sits out next spin</label>
        <button class="btn ghost" id="clearBtn" type="button">Clear all</button>
      </div>
    </section>
  </div>
</div>

<script>
const KEY = 'manhunt-wheel-v1';
const MAX = 20;
let state = { players: [
  { name: 'Alex', n: 1 }, { name: 'Jordan', n: 2 }, { name: 'Sam', n: 1 }, { name: 'Riley', n: 3 }
], last: null, skipLast: false, confirmClear: false };
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && Array.isArray(s.players)) state = Object.assign(state, s, { confirmClear: false }); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify({ players: state.players, last: state.last, skipLast: state.skipLast })); } catch (e) {} };

const $ = id => document.getElementById(id);
const canvas = $('wheel'), ctx = canvas.getContext('2d');
let rot = 0, spinning = false;

const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const colorFor = i => css('--s' + ((i % 6) + 1));

function eligible() {
  return state.players.filter(p => p.n > 0 && !(state.skipLast && p.name === state.last && state.players.filter(q => q.n > 0).length > 1));
}

function draw() {
  const dpr = window.devicePixelRatio || 1;
  const size = canvas.clientWidth;
  if (!size) return;
  canvas.width = size * dpr; canvas.height = size * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const c = size / 2, r = c - 6;
  ctx.clearRect(0, 0, size, size);
  const ps = eligible();
  const total = ps.reduce((a, p) => a + p.n, 0);
  ctx.save(); ctx.translate(c, c);
  // rim
  ctx.beginPath(); ctx.arc(0, 0, r + 4, 0, Math.PI * 2); ctx.fillStyle = css('--fg'); ctx.fill();
  ctx.rotate(rot);
  if (!total) {
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fillStyle = css('--line'); ctx.fill();
  }
  let a = 0;
  ps.forEach(p => {
    const idx = state.players.indexOf(p);
    const sweep = p.n / total * Math.PI * 2;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, r, a, a + sweep); ctx.closePath();
    ctx.fillStyle = colorFor(idx); ctx.fill();
    ctx.strokeStyle = css('--panel'); ctx.lineWidth = 2; ctx.stroke();
    // label
    ctx.save(); ctx.rotate(a + sweep / 2);
    ctx.fillStyle = css('--slice-text');
    const fs = Math.max(11, Math.min(22, size / 20, sweep * r * 0.45));
    ctx.font = `700 ${fs}px "Big Shoulders Stencil Display", Impact, sans-serif`;
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    let label = p.name.toUpperCase();
    const maxW = r * 0.62;
    while (ctx.measureText(label).width > maxW && label.length > 2) label = label.slice(0, -2) + '…';
    if (sweep > 0.08) ctx.fillText(label, r - 14, 0);
    ctx.restore();
    a += sweep;
  });
  // tick marks on rim
  ctx.rotate(-rot);
  for (let i = 0; i < 48; i++) {
    const t = i / 48 * Math.PI * 2;
    ctx.beginPath();
    ctx.moveTo(Math.cos(t) * (r - (i % 4 ? 3 : 7)), Math.sin(t) * (r - (i % 4 ? 3 : 7)));
    ctx.lineTo(Math.cos(t) * r, Math.sin(t) * r);
    ctx.strokeStyle = css('--panel'); ctx.globalAlpha = .45; ctx.lineWidth = 1.5; ctx.stroke();
  }
  ctx.restore();
}

function renderList() {
  const list = $('list');
  const total = state.players.reduce((a, p) => a + p.n, 0);
  $('tally').textContent = `${state.players.length} player${state.players.length === 1 ? '' : 's'} · ${total} entr${total === 1 ? 'y' : 'ies'}`;
  if (!state.players.length) {
    list.innerHTML = '<li class="empty" style="display:block">No players yet. Type a name above and press Add.</li>';
  } else {
    list.innerHTML = '';
    state.players.forEach((p, i) => {
      const pct = total ? Math.round(p.n / total * 100) : 0;
      const li = document.createElement('li');
      li.innerHTML = `
        <span class="swatch" style="background:${colorFor(i)}"></span>
        <span class="who"><b></b><span class="bar"><i style="width:${pct}%"></i></span></span>
        <span class="stepper" role="group">
          <button type="button" data-act="dec" ${p.n <= 0 ? 'disabled' : ''}>−</button>
          <output>${p.n}</output>
          <button type="button" data-act="inc" ${p.n >= MAX ? 'disabled' : ''}>+</button>
        </span>
        <button type="button" class="del" data-act="del">×</button>`;
      li.querySelector('b').textContent = p.name;
      li.querySelector('b').insertAdjacentHTML('afterend', '');
      li.querySelector('.who').insertAdjacentHTML('beforeend', `<span class="pct">${p.n} entr${p.n === 1 ? 'y' : 'ies'} · ${pct}% chance</span>`);
      li.querySelector('[data-act=dec]').setAttribute('aria-label', `Fewer entries for ${p.name}`);
      li.querySelector('[data-act=inc]').setAttribute('aria-label', `More entries for ${p.name}`);
      li.querySelector('[data-act=del]').setAttribute('aria-label', `Remove ${p.name}`);
      li.querySelectorAll('button').forEach(b => b.onclick = () => {
        if (spinning) return;
        const act = b.dataset.act;
        if (act === 'inc') p.n = Math.min(MAX, p.n + 1);
        if (act === 'dec') p.n = Math.max(0, p.n - 1);
        if (act === 'del') state.players.splice(i, 1);
        update();
      });
      list.appendChild(li);
    });
  }
  $('history').innerHTML = state.last ? `Last hunter: <b></b>` : '';
  if (state.last) $('history').querySelector('b').textContent = state.last;
  $('skipLast').checked = state.skipLast;
  $('spin').disabled = spinning || !eligible().length;
  $('clearBtn').textContent = state.confirmClear ? 'Tap again to clear' : 'Clear all';
}

function update() { save(); renderList(); draw(); }

$('addForm').addEventListener('submit', e => {
  e.preventDefault();
  const name = $('nameInput').value.trim();
  if (!name) return;
  const existing = state.players.find(p => p.name.toLowerCase() === name.toLowerCase());
  if (existing) existing.n = Math.min(MAX, existing.n + 1);
  else state.players.push({ name, n: 1 });
  $('nameInput').value = '';
  update();
});

$('clearBtn').onclick = () => {
  if (spinning) return;
  if (!state.confirmClear) { state.confirmClear = true; renderList(); setTimeout(() => { state.confirmClear = false; renderList(); }, 2500); return; }
  state.players = []; state.last = null; state.confirmClear = false;
  $('resLabel').textContent = 'Add players, then spin'; $('resName').textContent = '—'; $('resName').classList.remove('hot'); $('resOdds').textContent = '';
  update();
};
$('skipLast').onchange = e => { state.skipLast = e.target.checked; update(); };

$('spin').onclick = () => {
  const ps = eligible();
  const total = ps.reduce((a, p) => a + p.n, 0);
  if (!total || spinning) return;
  // weighted pick
  let r = Math.random() * total, winner = ps[0], start = 0;
  for (const p of ps) { if (r < p.n) { winner = p; break; } r -= p.n; start += p.n; }
  const s0 = start / total * Math.PI * 2, sw = winner.n / total * Math.PI * 2;
  const theta = s0 + sw * (0.15 + Math.random() * 0.7);
  // pointer sits at -90°; land theta under it
  const TAU = Math.PI * 2;
  let target = -Math.PI / 2 - theta;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const turns = reduce ? 1 : 6 + Math.floor(Math.random() * 3);
  let delta = ((target - rot) % TAU + TAU) % TAU + turns * TAU;
  const from = rot, dur = reduce ? 600 : 5200 + Math.random() * 1200, t0 = performance.now();
  spinning = true; renderList();
  $('resLabel').textContent = 'Spinning…'; $('resName').textContent = '· · ·'; $('resName').classList.remove('hot'); $('resOdds').textContent = '';
  const ease = t => 1 - Math.pow(1 - t, 4);
  (function frame(now) {
    const t = Math.min(1, (now - t0) / dur);
    rot = from + delta * ease(t);
    draw();
    if (t < 1) return requestAnimationFrame(frame);
    rot = ((rot % TAU) + TAU) % TAU;
    spinning = false;
    state.last = winner.name;
    $('resLabel').textContent = 'The hunter is';
    $('resName').textContent = winner.name; $('resName').classList.add('hot');
    $('resOdds').textContent = `${winner.n} of ${total} entries · ${Math.round(winner.n / total * 100)}% odds. Everyone else, run.`;
    update();
  })(t0);
};

addEventListener('resize', draw);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { renderList(); draw(); });
new MutationObserver(() => { renderList(); draw(); }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
if (document.fonts) document.fonts.ready.then(draw);
renderList(); draw();
</script>
</body>
</html>
